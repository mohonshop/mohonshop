<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoHoN Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--b:#12285c;--g:#16a34a;--o:#f97316;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:#1b1f2a}
a{color:inherit;text-decoration:none}header{background:var(--b);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:36px;background:#fff;border-radius:6px}header b{flex:1;font-size:18px}
button,.btn{border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;background:var(--b);color:#fff;display:inline-block}
.g{background:var(--g)}.o{background:var(--o)}.w{background:#e5e9f2;color:#111}.r{background:#dc2626}
main{max-width:1000px;margin:auto;padding:12px}input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #c9d1e3;border-radius:8px;font-size:15px;background:#fff}
.sl{height:150px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;padding:16px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0001}.card .im{aspect-ratio:1;background:#dbe3f5;display:flex;align-items:center;justify-content:center;color:var(--b);font-weight:700;position:relative}
.im img{width:100%;height:100%;object-fit:cover}.card div.t{padding:8px}.old{text-decoration:line-through;color:#888;font-size:13px}.out{position:absolute;inset:auto 0 0 0;background:#dc2626;color:#fff;text-align:center;font-size:13px}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}.chip{display:inline-block;padding:6px 12px;border:1px solid #c9d1e3;border-radius:20px;margin:3px;cursor:pointer}.chip.on{background:var(--b);color:#fff}
.gal{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory}.gal>*{flex:0 0 100%;aspect-ratio:1;scroll-snap-align:center;border-radius:12px;object-fit:cover;background:#dbe3f5}
footer{background:var(--b);color:#fff;padding:20px 14px;margin-top:20px;line-height:1.7}footer a{text-decoration:underline}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
</style></head><body>
<header><a href="#/"><img src="logo.png" alt="" onerror="this.style.display='none'"></a><b>MoHoN Shop</b><button class="w" onclick="setL()" id="lb"></button><a href="#/cart" class="btn o" id="cb"></a></header>
<main id="app"></main>
<footer><b style="font-size:18px">MoHoN Shop</b><p id="ab"></p><div>Contact: <a href="tel:01725233759">01725233759</a></div><div>WhatsApp: <a href="https://wa.me/8801725233759">01725233759</a></div><div>Email: <a href="mailto:mashiurrahman.bus@gmail.com">mashiurrahman.bus@gmail.com</a></div><div style="margin-top:10px"><a href="#/admin" style="font-size:12px;opacity:.6">Admin</a></div></footer>
<script>
const sb=supabase.createClient("https://jutprpthfsjcaibmrzgv.supabase.co","sb_publishable_UO22EIV41ICacCK_9AXI6g_GZpoRWxt");
const WA="8801725233759",PAY="01725233759";
const D={bn:{lang:"English",cart:"কার্ট",search:"প্রোডাক্ট খুঁজুন",all:"সব",men:"পুরুষ",women:"মহিলা",new:"নতুন",lo:"দাম কম",hi:"দাম বেশি",out:"স্টক শেষ",size:"সাইজ",color:"রঙ",qty:"পরিমাণ",buy:"এখনই অর্ডার",add:"কার্টে যোগ করুন",added:"কার্টে যোগ হয়েছে",rev:"রিভিউ",norev:"এখনও রিভিউ নেই",name:"আপনার নাম",mob:"মোবাইল নাম্বার",mail:"ইমেইল",addr:"পূর্ণ ঠিকানা",area:"ডেলিভারি এলাকা",in:"ঢাকার ভেতরে (৬০ টাকা)",ou:"ঢাকার বাইরে (১২০ টাকা)",trx:"ট্রানজেকশন ID",snd:"যে নাম্বার থেকে পাঠিয়েছেন",place:"অর্ডার কনফার্ম করুন",empty:"কার্ট খালি",sub:"মোট দাম",dc:"অ্যাডভান্স ডেলিভারি চার্জ",pay:"আগে অ্যাডভান্স ডেলিভারি চার্জ bKash/Nagad (Personal) নাম্বারে Send Money করুন:",done:"ধন্যবাদ! আপনার অর্ডার জমা হয়েছে। অর্ডার নং:",send:"রিভিউ পাঠান",rt:"আপনার মন্তব্য",rsent:"রিভিউ পাঠানো হয়েছে, অনুমোদনের পর দেখা যাবে",ab:"MoHoN Shop একটি বিশ্বস্ত অনলাইন শপ। আমরা মানসম্মত পোশাক ও পণ্য সারা বাংলাদেশে পৌঁছে দিই, সহজ অর্ডার ও দ্রুত ডেলিভারির মাধ্যমে।",s1:"নতুন কালেকশন এসেছে",s2:"বিশেষ অফার চলছে",s3:"সারা বাংলাদেশে ডেলিভারি",tk:"৳",fill:"সব ঘর পূরণ করুন"},
en:{lang:"বাংলা",cart:"Cart",search:"Search products",all:"All",men:"Men",women:"Women",new:"Newest",lo:"Price low",hi:"Price high",out:"Out of stock",size:"Size",color:"Color",qty:"Quantity",buy:"Order Now",add:"Add to Cart",added:"Added to cart",rev:"Reviews",norev:"No reviews yet",name:"Your name",mob:"Mobile number",mail:"Email",addr:"Full address",area:"Delivery area",in:"Inside Dhaka (60 Tk)",ou:"Outside Dhaka (120 Tk)",trx:"Transaction ID",snd:"Number you sent from",place:"Confirm Order",empty:"Cart is empty",sub:"Subtotal",dc:"Advance delivery charge",pay:"First send the advance delivery charge via bKash/Nagad (Personal) to:",done:"Thank you! Your order is placed. Order no:",send:"Submit review",rt:"Your comment",rsent:"Review sent, it will show after approval",ab:"MoHoN Shop is a trusted online shop. We deliver quality clothing and products across Bangladesh with easy ordering and fast delivery.",s1:"New collection is here",s2:"Special offers running",s3:"Delivery all over Bangladesh",tk:"Tk ",fill:"Please fill all fields"}};
let lang=localStorage.l||"bn",P=[],cart=JSON.parse(localStorage.c||"[]"),direct=null,F={q:"",cat:"",g:"",s:"new"},sel={},si=0;
const t=k=>D[lang][k]||k,$=id=>document.getElementById(id);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const nm=p=>lang=="en"&&p.name_en?p.name_en:p.name_bn,tk=n=>t("tk")+n;
const saveC=()=>{localStorage.c=JSON.stringify(cart);chrome()};
function chrome(){$("lb").textContent=t("lang");$("cb").textContent="🛒 "+t("cart")+" ("+cart.length+")";$("ab").textContent=t("ab")}
function setL(){lang=lang=="bn"?"en":"bn";localStorage.l=lang;chrome();route()}
async function load(){const r=await sb.from("products").select("*").order("created_at",{ascending:false});P=r.data||[]}
async function route(){const h=location.hash.slice(1)||"/";window.scrollTo(0,0);
 if(!P.length&&!h.startsWith("/admin"))await load();
 if(h=="/")home();else if(h.startsWith("/product/"))prod(decodeURIComponent(h.slice(9)));
 else if(h=="/cart")cartV();else if(h=="/checkout")checkout();else if(h=="/admin")admin();else home()}
function home(){const S=[["#12285c",t("s1")],["#f97316",t("s2")],["#16a34a",t("s3")]];
 $("app").innerHTML=`<div class="sl" id="sl"></div><div class="bar"><input id="q" placeholder="${t("search")}" value="${e(F.q)}" oninput="F.q=this.value;list()"><select onchange="F.s=this.value;list()"><option value="new">${t("new")}</option><option value="lo" ${F.s=="lo"?"selected":""}>${t("lo")}</option><option value="hi" ${F.s=="hi"?"selected":""}>${t("hi")}</option></select></div>
 <div id="cats"></div><div class="grid" id="gr"></div>`;
 const sl=()=>{const x=S[si++%3];if($("sl")){$("sl").style.background=x[0];$("sl").textContent=x[1]}};sl();clearInterval(window.tm);window.tm=setInterval(sl,3500);cats();list()}
function cats(){const cs=[...new Set(P.map(p=>p.category).filter(Boolean))];
 $("cats").innerHTML=[["",t("all"),"g"],["men",t("men"),"g"],["women",t("women"),"g"]].map(a=>`<span class="chip ${F.g==a[0]?"on":""}" onclick="F.g='${a[0]}';cats();list()">${a[1]}</span>`).join("")+"<br>"+
 [""].concat(cs).map(c=>`<span class="chip ${F.cat==c?"on":""}" onclick="F.cat=this.dataset.c;cats();list()" data-c="${e(c)}">${c?e(c):t("all")}</span>`).join("")}
function list(){let a=P.filter(p=>(!F.g||p.gender==F.g)&&(!F.cat||p.category==F.cat)&&(nm(p)+(p.name_en||"")+p.name_bn).toLowerCase().includes(F.q.toLowerCase()));
 if(F.s=="lo")a.sort((x,y)=>x.price-y.price);if(F.s=="hi")a.sort((x,y)=>y.price-x.price);
 $("gr").innerHTML=a.map(p=>`<a class="card" href="#/product/${encodeURIComponent(p.slug)}"><div class="im">${p.images[0]?`<img src="${e(p.images[0])}" alt="">`:e(nm(p))}${p.in_stock?"":`<div class="out">${t("out")}</div>`}</div><div class="t"><div>${e(nm(p))}</div><b>${tk(p.price)}</b> ${p.old_price?`<span class="old">${tk(p.old_price)}</span>`:""}</div></a>`).join("")}
async function prod(slug){const p=P.find(x=>x.slug==slug);if(!p){$("app").innerHTML="404";return}
 sel={size:p.sizes[0],color:p.colors[0],qty:1,p};
 const r=(await sb.from("reviews").select("*").eq("product_id",p.id).order("created_at",{ascending:false})).data||[];
 const ch=(k,a)=>a.length?`<div>${t(k=="size"?"size":"color")}:</div>`+a.map(v=>`<span class="chip ${sel[k]==v?"on":""}" onclick="pick('${k}',this)">${e(v)}</span>`).join(""):"";
 $("app").innerHTML=`<div class="box"><div class="gal">${p.images.length?p.images.map(i=>`<img src="${e(i)}" alt="">`).join(""):`<div class="im">${e(nm(p))}</div>`}</div>
 <h2>${e(nm(p))}</h2><b style="font-size:22px">${tk(p.price)}</b> ${p.old_price?`<span class="old">${tk(p.old_price)}</span>`:""}<p>${e(p.description)}</p>
 <div id="sz">${ch("size",p.sizes)}</div><div id="cl">${ch("color",p.colors)}</div><p>${t("qty")}: <input type="number" min="1" value="1" style="width:80px" oninput="sel.qty=Math.max(1,+this.value||1)"></p>
 ${p.in_stock?`<button class="g" onclick="buy()">${t("buy")}</button> <button class="o" onclick="addC()">${t("add")}</button>`:`<b style="color:#dc2626">${t("out")}</b>`}</div>
 <div class="box"><h3>${t("rev")}</h3>${r.length?r.map(x=>`<div class="row"><span>${"★".repeat(x.rating)} <b>${e(x.name)}</b><br>${e(x.comment)}</span></div>`).join(""):t("norev")}
 <hr><input id="rn" placeholder="${t("name")}"><select id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea id="rc" placeholder="${t("rt")}"></textarea><button onclick="sendR('${p.id}')">${t("send")}</button></div>`}
function pick(k,el){sel[k]=el.textContent;[...el.parentElement.querySelectorAll(".chip")].forEach(c=>c.classList.toggle("on",c==el))}
const item=()=>({slug:sel.p.slug,name:sel.p.name_bn,size:sel.size||"",color:sel.color||"",qty:sel.qty,price:sel.p.price});
function addC(){cart.push(item());saveC();alert(t("added"))}
function buy(){direct=[item()];location.hash="#/checkout"}
async function sendR(id){const n=$("rn").value.trim();if(!n)return alert(t("fill"));
 await sb.from("reviews").insert({product_id:id,name:n,rating:+$("rr").value,comment:$("rc").value});alert(t("rsent"));$("rn").value=$("rc").value=""}
function cartV(){$("app").innerHTML=`<div class="box">${cart.length?cart.map((c,i)=>`<div class="row"><span>${e(c.name)} (${e(c.size)} ${e(c.color)}) × ${c.qty}</span><span>${tk(c.price*c.qty)} <button class="r" onclick="cart.splice(${i},1);saveC();cartV()">✕</button></span></div>`).join("")+`<p><a class="btn g" href="#/checkout" onclick="direct=null">${t("buy")}</a></p>`:t("empty")}</div>`}
function checkout(){const it=direct||cart;if(!it.length){cartV();return}const sub=it.reduce((s,c)=>s+c.price*c.qty,0);
 $("app").innerHTML=`<div class="box">${it.map(c=>`<div class="row"><span>${e(c.name)} (${e(c.size)} ${e(c.color)}) × ${c.qty}</span><span>${tk(c.price*c.qty)}</span></div>`).join("")}<p>${t("sub")}: <b>${tk(sub)}</b></p>
 <input id="n" placeholder="${t("name")}"><input id="m" type="tel" placeholder="${t("mob")}"><input id="em" type="email" placeholder="${t("mail")}"><textarea id="ad" placeholder="${t("addr")}"></textarea>
 <select id="ar" onchange="dcu()"><option value="60">${t("in")}</option><option value="120">${t("ou")}</option></select>
 <p style="background:#eef3ff;padding:10px;border-radius:8px">${t("pay")}<br><b style="font-size:20px">${PAY}</b><br>${t("dc")}: <b id="dc">${tk(60)}</b></p>
 <input id="tx" placeholder="${t("trx")}"><input id="sn" type="tel" placeholder="${t("snd")}"><button class="g" onclick="place()">${t("place")}</button></div>`}
const dcu=()=>$("dc").textContent=tk($("ar").value);
async function place(){const v=id=>$(id).value.trim(),it=direct||cart;
 if(!v("n")||!v("m")||!v("em")||!v("ad")||!v("tx")||!v("sn"))return alert(t("fill"));
 const no="MH"+Date.now().toString().slice(-8),dc=+$("ar").value,sub=it.reduce((s,c)=>s+c.price*c.qty,0);
 const r=await sb.from("orders").insert({order_no:no,customer_name:v("n"),mobile:v("m"),email:v("em"),address:v("ad"),area:dc==60?"Dhaka":"Outside",delivery_charge:dc,subtotal:sub,items:it,trx_id:v("tx"),sender_number:v("sn")});
 if(r.error)return alert("Error: "+r.error.message);
 const msg=`New order ${no}\n${it.map(c=>`${c.name} ${c.size} ${c.color} x${c.qty}`).join("\n")}\nTotal: ${sub}+${dc}\n${v("n")} ${v("m")}\n${v("ad")}\nTrx: ${v("tx")} (${v("sn")})`;
 if(!direct)cart=[];direct=null;saveC();
 $("app").innerHTML=`<div class="box"><h3>✅ ${t("done")} ${no}</h3><a class="btn g" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">WhatsApp</a></div>`}
/* ADMIN */
async function admin(){const s=(await sb.auth.getSession()).data.session;
 if(!s){$("app").innerHTML=`<div class="box"><h3>Admin Login</h3><input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password"><button onclick="login()">Login</button></div>`;return}
 $("app").innerHTML=`<div class="box"><button onclick="tab('o')">Orders</button> <button onclick="tab('p')">Products</button> <button onclick="tab('r')">Reviews</button> <button class="r" onclick="sb.auth.signOut().then(admin)">Logout</button></div><div id="ad2"></div>`;tab("o")}
async function login(){const r=await sb.auth.signInWithPassword({email:$("ae").value,password:$("ap").value});if(r.error)alert(r.error.message);else admin()}
async function tab(k){const A=$("ad2");
 if(k=="o"){const d=(await sb.from("orders").select("*").order("created_at",{ascending:false})).data||[];
  A.innerHTML=d.map(o=>`<div class="box"><b>${e(o.order_no)}</b> · ${new Date(o.created_at).toLocaleString()}<br>${e(o.customer_name)} · ${e(o.mobile)} · ${e(o.email)}<br>${e(o.address)}<br>${(o.items||[]).map(c=>`${e(c.name)} ${e(c.size)} ${e(c.color)} ×${c.qty}`).join("<br>")}<br>৳${o.subtotal} + ডেলিভারি ৳${o.delivery_charge}<br>Trx: <b>${e(o.trx_id)}</b> (${e(o.sender_number)})<br>
  <select onchange="sb.from('orders').update({status:this.value}).eq('id','${o.id}').then(()=>0)">${["pending","confirmed","shipped","delivered","cancelled"].map(s=>`<option ${o.status==s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"No orders"}
 if(k=="p"){await load();A.innerHTML=`<div class="box"><h3>Add product</h3><input id="s" placeholder="slug (e.g. blue-panjabi)"><input id="nb" placeholder="নাম (বাংলা)"><input id="ne" placeholder="Name (English)"><input id="ca" placeholder="Category (e.g. পাঞ্জাবি)"><select id="ge"><option value="men">Men</option><option value="women">Women</option></select><input id="pr" type="number" placeholder="Price"><input id="op" type="number" placeholder="Old price (optional)"><input id="co" placeholder="Colors, comma separated"><input id="sz2" placeholder="Sizes, comma separated (M,L,XL)"><textarea id="im" placeholder="Image URLs, comma separated"></textarea><textarea id="de" placeholder="Description"></textarea><button class="g" onclick="addP()">Save</button></div>`+
  P.map(p=>`<div class="box row"><span>${e(p.name_bn)} ৳${p.price} ${p.in_stock?"":"(স্টক শেষ)"}</span><span><button class="w" onclick="sb.from('products').update({in_stock:${!p.in_stock}}).eq('id','${p.id}').then(()=>tab('p'))">Stock</button> <button class="r" onclick="confirm('Delete?')&&sb.from('products').delete().eq('id','${p.id}').then(()=>tab('p'))">✕</button></span></div>`).join("")}
 if(k=="r"){const d=(await sb.from("reviews").select("*").order("created_at",{ascending:false})).data||[];
  A.innerHTML=d.map(x=>`<div class="box">${"★".repeat(x.rating)} <b>${e(x.name)}</b> ${x.approved?"✅":"⏳"}<br>${e(x.comment)}<br><button class="g" onclick="sb.from('reviews').update({approved:${!x.approved}}).eq('id','${x.id}').then(()=>tab('r'))">${x.approved?"Hide":"Approve"}</button> <button class="r" onclick="sb.from('reviews').delete().eq('id','${x.id}').then(()=>tab('r'))">Delete</button></div>`).join("")||"No reviews"}}
async function addP(){const l=id=>$(id).value.split(",").map(s=>s.trim()).filter(Boolean);
 const r=await sb.from("products").insert({slug:$("s").value.trim(),name_bn:$("nb").value,name_en:$("ne").value,category:$("ca").value,gender:$("ge").value,price:+$("pr").value,old_price:+$("op").value||null,colors:l("co"),sizes:l("sz2"),images:l("im"),description:$("de").value});
 if(r.error)alert(r.error.message);else{P=[];tab("p")}}
window.onhashchange=route;chrome();route();
</script></body></html>
